{% set name = "pytest-memray" %}
{% set version = "1.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pytest_memray-{{ version }}.tar.gz
  sha256: 38f1068aa8562887d452ae14f77509f138be1acc74542dd5fc41e74f651cf932

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.11.1
- hatchling >=1.12.2
- hatch-vcs >=0.3
    - pip
  run:
    - python >={{ python_min }}
    - pytest >=7.2
- pytest >=8.0
- memray >=1.19.1

test:
  imports:
    - pytest_memray
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: A simple plugin to use with pytest
  home: https://github.com/bloomberg/pytest-memray
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cbourjau
